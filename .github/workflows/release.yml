name: Release

# Releases are deliberate, not a side effect of merging. workflow_dispatch is
# the normal path; the weekly schedule is the floor, so fixes don't sit on
# develop unreleased while nobody is looking.
#
# The version comes from the commit messages since the last tag (see
# .github/scripts/next_version.py): New: is a minor release, Fixed: or a
# runtime dependency bump is a patch, and unprefixed commits release nothing.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bump at least this much (auto decides from the commits)"
        required: false
        default: auto
        type: choice
        options:
          - "auto"
          - "patch"
          - "minor"
          - "major"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Promote develop -> main through a PR, not a direct push. Nothing is exempt
  # from main's protection: the PR is approved by automerge.yml's author
  # allowlist and merged by auto-merge once the required checks are green.
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A second app, distinct from the one that approves: GitHub refuses
      # self-approval, so the opener and the approver cannot be one identity.
      - name: Generate promoter token
        id: promoter
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTER_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Open promotion PR and wait for it to merge
        env:
          GH_TOKEN: ${{ steps.promoter.outputs.token }}
        run: |
          set -euo pipefail

          if git diff --quiet origin/main origin/develop; then
            echo "develop and main are identical — nothing to promote."
            exit 0
          fi

          pr=$(gh pr list --base main --head develop --state open \
                 --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head develop \
                   --title "Promote develop to main" \
                   --body "Automated promotion. Merged by auto-merge once the required checks are green." \
                   | grep -oE '[0-9]+$')
            echo "opened PR #$pr"
          else
            echo "reusing open PR #$pr"
          fi

          for _ in $(seq 1 120); do
            state=$(gh pr view "$pr" --json state --jq .state)
            [ "$state" = "MERGED" ] && { echo "promotion merged"; exit 0; }
            [ "$state" = "CLOSED" ] && { echo "::error::promotion PR was closed"; exit 1; }
            sleep 30
          done
          echo "::error::promotion PR #$pr did not merge within 60 minutes"
          exit 1

  version:
    needs: promote
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the next version
        id: next
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          [ "$FORCE" = "auto" ] && FORCE=""
          version=$(python3 .github/scripts/next_version.py --notes notes.md ${FORCE:+--force "$FORCE"})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "::notice::Nothing releasable since the last tag."
          else
            echo "Releasing $version"
            cat notes.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the release notes
        if: steps.next.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: notes.md

  # Build and test main as it now stands, stamped with the release version,
  # before anything is tagged.
  verify:
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  package:
    needs: [version, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [freebsd-x64, linux-arm, linux-arm64, linux-musl-arm64, linux-musl-x64, linux-x64, osx-arm64, osx-x64, win-x64, win-x86]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Download backend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-${{ matrix.runtime }}
          path: _output

      - name: Download UI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build_ui
          path: _output/UI

      - name: Package
        env:
          RUNTIME: ${{ matrix.runtime }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          framework=net10.0
          folder="_output/$RUNTIME/$framework"
          archive="Readarr.main.$VERSION.$RUNTIME"
          mkdir -p _artifacts

          cp -r _output/UI "$folder/Readarr"
          find "$folder/Readarr" -name "Readarr" -exec chmod a+x {} \;
          find "$folder/Readarr" -name "Readarr.Update" -exec chmod a+x {} \;

          case "$RUNTIME" in
            win-*) (cd "$folder" && zip -rq "$GITHUB_WORKSPACE/_artifacts/$archive.zip" ./Readarr) ;;
            *) tar -zcf "_artifacts/$archive.tar.gz" -C "$folder" Readarr ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-${{ matrix.runtime }}
          compression-level: 0
          if-no-files-found: error
          path: _artifacts/*

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The app token, not GITHUB_TOKEN: an event triggered by GITHUB_TOKEN
      # starts no workflow run, so anything listening for `release: published`
      # would never fire.
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Download packages and notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: release-*
          path: _release
          merge-multiple: true

      # Tag-only: the version lives in the tag, so there is no file to bump and
      # no commit to push to a protected branch. Rulesets cover branches, not tags.
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --notes-file _release/notes.md \
            _release/*.tar.gz _release/*.zip
